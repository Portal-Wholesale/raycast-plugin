name: Update Flake Inputs
on:
  schedule:
    # Repos update on staggered slots so Nixbot builds them one at a time.
    - cron: "0 17 * * 1" # Monday 17:00 UTC
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
      # One PR updates every input, so each week costs one Nixbot build.
      - id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "flake.lock: update all inputs"
          pr-labels: dependencies
      # Merges once the required Nixbot checks pass.
      - if: steps.update.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --merge "${{ steps.update.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ github.token }}
